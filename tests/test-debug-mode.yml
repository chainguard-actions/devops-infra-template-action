name: Test debug mode enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          foobar: 'debug-test'
          debug: 'true'
      - name: Assert foobar output echoes input in debug mode
        env:
          ACTUAL: ${{ steps.action.outputs.foobar }}
        run: |
          echo "actual foobar: $ACTUAL"
          if [ "$ACTUAL" != "debug-test" ]; then
            echo "FAIL: expected 'debug-test' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: foobar output matches input in debug mode"
      - name: Assert barfoo output is non-empty in debug mode
        env:
          ACTUAL: ${{ steps.action.outputs.barfoo }}
        run: |
          echo "actual barfoo: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected barfoo to be non-empty in debug mode"
            exit 1
          fi
          echo "PASS: barfoo output is non-empty in debug mode"
