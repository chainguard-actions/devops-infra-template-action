name: Test with github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          foobar: hello
          github_token: fake-token-for-testing
      - name: Assert foobar output echoes input
        env:
          ACTUAL: ${{ steps.action.outputs.foobar }}
        run: |
          echo "actual foobar: $ACTUAL"
          if [ "$ACTUAL" != "hello" ]; then
            echo "FAIL: expected foobar output to be 'hello', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert barfoo output is set
        env:
          ACTUAL: ${{ steps.action.outputs.barfoo }}
        run: |
          echo "actual barfoo: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected barfoo output to be non-empty"
            exit 1
          fi
          echo "PASS"
