name: Test custom foobar input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          foobar: my-custom-value
          debug: 'false'
      - name: Assert foobar output echoes custom input
        env:
          ACTUAL: ${{ steps.action.outputs.foobar }}
        run: |
          echo "actual foobar output: $ACTUAL"
          if [ "$ACTUAL" != "my-custom-value" ]; then
            echo "FAIL: expected 'my-custom-value' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
