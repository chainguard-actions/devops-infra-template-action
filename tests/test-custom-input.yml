name: Test custom foobar input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          foobar: 'hello-world'
          debug: 'false'
      - name: Assert foobar output echoes custom input
        env:
          ACTUAL: ${{ steps.action.outputs.foobar }}
        run: |
          echo "actual foobar: $ACTUAL"
          if [ "$ACTUAL" != "hello-world" ]; then
            echo "FAIL: expected 'hello-world' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: foobar output matches custom input"
      - name: Assert barfoo output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.barfoo }}
        run: |
          echo "actual barfoo: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected barfoo to be non-empty"
            exit 1
          fi
          echo "PASS: barfoo output is non-empty"
