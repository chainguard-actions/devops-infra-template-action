name: (Cron) Dependency Update

on:
  schedule:
    - cron: 0 5 * * 1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  issues: read

jobs:
  call:
    uses: devops-infra/.github/.github/workflows/reusable-cron-dependency-update.yml@88b425df3a0f0415f12a0678b84d065562363bdc # v1
    with:
      profile: actions
    secrets: inherit
